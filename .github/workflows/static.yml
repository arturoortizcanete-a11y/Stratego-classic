
name: Publicar Stratego Classic

on:
  push:
    branches:
      - principal
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        working-directory: estrategia-web-0.2
        run: npm install

      - name: Compilar juego
        working-directory: estrategia-web-0.2
        run: npm run build

      - name: Preparar GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: estrategia-web-0.2/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar juego
        id: deployment
        uses: actions/deploy-pages@v4
