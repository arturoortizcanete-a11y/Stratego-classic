
name: Publicar Stratego Classic

on:
  push:
    branches:
      - principal
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v5

      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Buscar proyecto y compilar
        run: |
          PROJECT_DIR=$(find . -name package.json -not -path '*/node_modules/*' -print -quit | xargs dirname)
          echo "Proyecto: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          npm install
          npm run build
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Preparar publicación
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PROJECT_DIR }}/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar juego
        id: deployment
        uses: actions/deploy-pages@v4
